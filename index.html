<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="System Alert — a retro, RPG-inspired developer status HUD built with HTML, CSS, and JavaScript.">
  <title>System Alert — Developer Status HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="system-window" aria-labelledby="player-title">
    <div class="system-header">
      <span class="warning" aria-hidden="true">!</span>
      <span>SYSTEM ALERT</span>
      <span id="clock" class="clock" aria-label="Local time">[--:--:--]</span>
    </div>

    <img
      class="avatar"
      src="assets/pic_for_code_project.webp"
      data-fallback="assets/avatar-placeholder.svg"
      alt="OVIEE avatar"
      width="100"
      height="100"
    >

    <h1 id="player-title">PLAYER: OVIEE</h1>
    <p class="bio" id="typewriter" aria-label="Player introduction"></p>

    <section class="stats-panel" aria-label="Player stats">
      <div class="stat">
        <div class="stat-heading"><span class="label">STR:</span> <span>[Lv.24] Back and Arm Focus</span></div>
        <div class="progress-bar" role="progressbar" aria-label="Strength level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="24">
          <div class="progress" style="width: 24%;"></div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-heading"><span class="label">INT:</span> <span>[Lv.30] CSE Engineering</span></div>
        <div class="progress-bar" role="progressbar" aria-label="Intelligence level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30">
          <div class="progress" style="width: 30%;"></div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-heading"><span class="label">JPN:</span> <span>[Lv.38] Hiragana &amp; Vocab Grind</span></div>
        <div class="progress-bar" role="progressbar" aria-label="Japanese study progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38">
          <div class="progress" style="width: 38%;"></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="quests-title">
      <h2 class="section-title" id="quests-title">ACTIVE QUESTS</h2>
      <nav class="links" aria-label="Player quests">
        <button class="quest-button" type="button" data-quest="Japan 2027 Departure">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span>Main Quest: Japan 2027 Departure</span>
        </button>
        <button class="quest-button" type="button" data-quest="Python Algorithm Vault">Python Algorithm Vault</button>
        <button class="quest-button" type="button" data-quest="Clothing Brand Concept" data-locked="true">
          <span class="locked-label">[LOCKED]</span> Clothing Brand Concept
        </button>
        <button class="quest-button" type="button" data-quest="Language &amp; Study Tracker">Language &amp; Study Tracker</button>
      </nav>
      <p id="quest-status" class="quest-status" role="status" aria-live="polite">Select a quest to view its status.</p>
    </section>

    <footer>GEAR: Ryzen 7 | RTX 4050 | 16GB RAM</footer>
  </main>
</body>
</html>
